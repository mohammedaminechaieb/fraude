# docker compose up --build  →  application : http://localhost:8501  ·  API : http://localhost:8000/docs
services:
  app:
    build: .
    image: fraude:latest
    environment:
      SERVICE: app
      PORT: "8501"
    ports:
      - "8501:8501"
  api:
    build: .
    image: fraude:latest
    environment:
      SERVICE: api
      PORT: "8000"
    ports:
      - "8000:8000"
